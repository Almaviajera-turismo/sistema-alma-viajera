<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sistema de código de programación</title>
<style>
:root{--ink:#1e1b2e;--muted:#6b6880;--line:#e6e3ef;--bg:#f6f5fb;--card:#fff;--brand:#3b2f7a;--brand2:#5a4bb0;--ok:#127a46;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:11px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:#efedf8;color:var(--brand)}.btn.tiny{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{background:#fdecea;color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#3d3a52}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:400;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #cfc8f3;border-color:#8b7fd0}
/* ingreso */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#231c4d,#3b2f7a 60%,#5a4bb0)}
.login-card{width:min(400px,100%);background:#fff;border-radius:20px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card h1{margin:0 0 4px;font-size:22px}.login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.login-card form{display:grid;gap:14px}.err{color:var(--bad);min-height:1.2em;font-size:14px;margin:0}
/* app */
#app{display:none;min-height:100vh}
header{background:#231c4d;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}header small{color:#c9c3ec}
main{max-width:1200px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.kpi span{color:var(--muted);font-size:13px}.kpi b{display:block;font-size:20px;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:200px}
.bar input,.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #f0eef6;vertical-align:top}.r{text-align:right;white-space:nowrap}
.sub{display:block;color:var(--muted);font-size:12px}.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#efedf8;color:var(--brand)}
.tag.Confirmada{background:#e6f6ec;color:var(--ok)}.tag.Perdida{background:#fdecea;color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
dialog{border:0;border-radius:20px;padding:0;width:min(760px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(20,16,40,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:18px}
.db{padding:18px 20px;max-height:72vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.calc{background:#f6f5fb;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:14px}.calc div{display:flex;justify-content:space-between;gap:10px}.calc .tot{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.estsel{padding:5px 8px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:600;background:#fff}.estsel.Confirmada{background:#e6f6ec;color:var(--ok)}.estsel.Enviada{background:#eef0ff;color:#3b4bb0}.estsel.Perdida{background:#fdecea;color:var(--bad)}
.flyer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:#f6f5fb;border:1px dashed #cfc8f3;border-radius:14px}.flyer .full{flex-basis:100%}.opc{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:6px;cursor:pointer}.opc:hover{border-color:#8b7fd0}
.df{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:640px){.grid{grid-template-columns:1fr}main{padding:14px}header{padding:12px 14px}}
</style>
</head>
<body>
<section id="login">
  <div class="login-card">
    <h1>Sistema de código de programación</h1>
    <p>Ingresá con tu usuario.</p>
    <form id="fLogin" autocomplete="on">
      <label class="field">Email<input name="email" type="email" required autocomplete="username"></label>
      <label class="field">Contraseña<input name="pass" type="password" required autocomplete="current-password"></label>
      <p class="err" id="lErr"></p>
      <button class="btn" type="submit">Ingresar</button>
    </form>
  </div>
</section>

<section id="app">
  <header><div><h1>Sistema de código de programación</h1><small>Cotizaciones · neto, comisión de Martín y ganancia</small></div>
    <div style="display:flex;gap:8px"><button class="btn ghost tiny" id="bConfig">⚙ Comisión de Martín</button><button class="btn ghost tiny" id="bSalir">Salir</button></div></header>
  <main>
    <div class="tabs"><button type="button" class="tab on" data-v="cot">Cotizaciones</button><button type="button" class="tab" data-v="rent">Rentabilidad</button></div>
    <div id="vCot">
    <div class="cards" id="kpis"></div>
    <div class="panel">
      <div class="bar"><input id="q" placeholder="Buscar cliente, paquete, destino o proveedor…"><select id="fEst"></select><input type="month" id="fMes" style="flex:0 0 auto;min-width:0"><button class="btn" id="bNueva">+ Nueva cotización</button></div>
      <div id="lista"></div>
    </div>
    </div>
    <div id="vRent" style="display:none"></div>
  </main>
</section>

<dialog id="dlg"><form id="fCot" method="dialog">
  <div class="dh"><h2 id="dTit">Nueva cotización</h2><button type="button" class="btn ghost tiny" data-cerrar>✕</button></div>
  <div class="db"><div class="flyer">
    <label class="btn ghost tiny" style="cursor:pointer">📎 Subir flyer<input type="file" id="fFlyer" accept="image/*" multiple hidden></label>
    <span id="flEstado" class="sub" style="display:inline"></span><span id="flVer"></span>
    <div id="flOpc" class="full"></div></div><div class="grid">
    <label class="field">Cliente<input name="cliente" required></label>
    <label class="field">Contacto<input name="contacto" placeholder="Teléfono o email"></label>
    <label class="field full">Paquete<input name="paquete" placeholder="Ej.: Cancún 7 noches all inclusive con aéreo"></label>
    <label class="field">Destino<input name="destino"></label>
    <label class="field">Proveedor<input name="proveedor"></label>
    <label class="field">Salida<input name="salida" type="date"></label>
    <label class="field">Regreso<input name="regreso" type="date"></label>
    <label class="field">Pasajeros<input name="pasajeros" type="number" min="0"></label>
    <label class="field">Moneda<select name="moneda"><option>USD</option><option>ARS</option><option>EUR</option></select></label>
    <label class="field">Neto del paquete<input name="neto" type="number" step="0.01" min="0" placeholder="0"></label>
    <label class="field">Precio por persona<input name="precio_pp" type="number" step="0.01" min="0" placeholder="Del flyer"></label>
    <label class="field">Precio de venta (total)<input name="venta" type="number" step="0.01" min="0" placeholder="0"></label>
    <label class="field">Comisión de Martín (%)<input name="comision_pct" type="number" step="0.01" min="0" max="100"></label>
    <label class="field">Calculada sobre<select name="comision_base"><option value="venta">Precio de venta</option><option value="neto">Neto del paquete</option><option value="margen">Diferencia venta − neto</option></select></label>
    <div class="calc full" id="calc"></div>
    <label class="field">Estado<select name="estado"></select></label>
    <span></span>
    <label class="field full">Notas<textarea name="notas" rows="3"></textarea></label>
  </div></div>
  <div class="df"><span><button type="button" class="btn danger tiny" id="bBorrar">Eliminar</button></span><span style="display:flex;gap:8px"><button type="button" class="btn ghost" data-cerrar>Cancelar</button><button class="btn" type="submit">Guardar</button></span></div>
</form></dialog>

<script>
(() => {
'use strict';
const URL_ = 'https://kwybigrovltwbgvbngdx.supabase.co', KEY = 'sb_publishable__WIXiJicmWGT5c59Lxj12Q_ENA3Xc9W';
const DUENO = 'a089eaad-2dd1-4bc4-bc11-39f6a960fe3c', SK = 'codigo-sesion-v1', CK = 'codigo-comision-v1';
const ESTADOS = ['Pendiente', 'Enviada', 'Confirmada', 'Perdida'];
let vista = 'cot';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, c) => (c || 'USD') + ' ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pc = (g, v) => v ? (g / v * 100).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' %' : '—';
const fmt = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '—';
let ses = null, filas = [], actual = null;

/* sesión propia de esta página (no comparte la del sistema de la agencia) */
function guardarSes(j) { ses = { t: j.access_token, r: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 }; try { sessionStorage.setItem(SK, JSON.stringify(ses)); } catch (e) {} }
async function token() {
  if (!ses) throw new Error('sin sesión');
  if (Date.now() > ses.exp - 90000) {
    const r = await fetch(URL_ + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: ses.r }) });
    if (!r.ok) { salir(); throw new Error('La sesión venció'); }
    guardarSes(await r.json());
  }
  return ses.t;
}
async function rest(path, opt = {}) {
  const r = await fetch(URL_ + '/rest/v1/' + path, { ...opt, headers: { apikey: KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error(m || 'Error ' + r.status); }
  return r;
}
async function salir() {
  try { if (ses) await fetch(URL_ + '/auth/v1/logout', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + ses.t } }); } catch (e) {}
  ses = null; try { sessionStorage.removeItem(SK); } catch (e) {}
  $('app').style.display = 'none'; $('login').style.display = '';
}
$('fLogin').onsubmit = async e => {
  e.preventDefault(); const f = e.target; $('lErr').textContent = '';
  try {
    const r = await fetch(URL_ + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: f.email.value.trim(), password: f.pass.value }) });
    const j = await r.json().catch(() => ({})); f.pass.value = '';
    if (!r.ok) { $('lErr').textContent = 'Email o contraseña incorrectos.'; return; }
    if (j.user?.id !== DUENO) { await fetch(URL_ + '/auth/v1/logout', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + j.access_token } }).catch(() => {}); $('lErr').textContent = 'Acceso denegado.'; return; }
    guardarSes(j); entrar();
  } catch (x) { $('lErr').textContent = 'No se pudo conectar.'; }
};
$('bSalir').onclick = salir;
setInterval(() => { if (ses && Date.now() - (window.__act || Date.now()) > 3600000) salir(); }, 30000);
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { window.__act = Date.now(); }, true));

/* cálculo */
function calcular(x) {
  const neto = Number(x.neto || 0), venta = Number(x.venta || 0), pct = Number(x.comision_pct || 0);
  const base = x.comision_base === 'neto' ? neto : x.comision_base === 'margen' ? Math.max(0, venta - neto) : venta;
  const com = Math.round(base * pct) / 100;
  return { neto, venta, pct, com, gan: venta - neto - com };
}
const pctDef = () => { try { return localStorage.getItem(CK) || ''; } catch (e) { return ''; } };
$('bConfig').onclick = () => { const v = prompt('Comisión de Martín por defecto (%) para las cotizaciones nuevas:', pctDef()); if (v == null) return; const n = Number(String(v).replace(',', '.')); if (!(n >= 0 && n <= 100)) return alert('Poné un porcentaje entre 0 y 100'); try { localStorage.setItem(CK, String(n)); } catch (e) {} alert('Listo: ' + n + ' % para las cotizaciones nuevas.'); };

/* lista */
async function entrar() {
  $('login').style.display = 'none'; $('app').style.display = 'block'; window.__act = Date.now();
  $('fEst').innerHTML = '<option value="">Todos los estados</option>' + ESTADOS.map(s => '<option>' + s + '</option>').join('');
  await cargar();
}
async function cargar() { try { filas = await (await rest('codigo_cotizaciones?select=*&order=creado.desc')).json(); pintar(); } catch (e) { alert('No se pudo cargar: ' + e.message); } }
function pintar() {
  const q = $('q').value.toLowerCase(), est = $('fEst').value, mes = $('fMes').value;
  const ls = filas.filter(r => (!est || r.estado === est) && (!mes || String(r.creado).slice(0, 7) === mes) && (!q || [r.cliente, r.paquete, r.destino, r.proveedor, r.contacto].join(' ').toLowerCase().includes(q)));
  const tot = {};
  for (const r of ls) { if (r.estado === 'Perdida') continue; const c = r.moneda || 'USD', k = calcular(r); tot[c] = tot[c] || { n: 0, v: 0, m: 0, g: 0, conf: 0 }; tot[c].n++; tot[c].v += k.venta; tot[c].m += k.com; tot[c].g += k.gan; if (r.estado === 'Confirmada') tot[c].conf++; }
  const ms = Object.entries(tot);
  $('kpis').innerHTML = ms.length ? ms.map(([c, t]) => '<div class="kpi"><span>Venta ' + c + ' (' + t.n + ' cot. · ' + t.conf + ' confirmadas)</span><b>' + money(t.v, c) + '</b></div><div class="kpi"><span>Comisión de Martín ' + c + '</span><b>' + money(t.m, c) + '</b></div><div class="kpi"><span>Ganancia del paquete ' + c + '</span><b class="' + (t.g < 0 ? 'neg' : 'pos') + '">' + money(t.g, c) + '</b></div>').join('') : '<div class="kpi"><span>Todavía no hay cotizaciones</span><b>—</b></div>';
  $('lista').innerHTML = ls.length ? '<div class="tw"><table><thead><tr><th>Fecha</th><th>Cliente / paquete</th><th>Viaje</th><th class="r">Neto</th><th class="r">Venta</th><th class="r">Comisión Martín</th><th class="r">Ganancia</th><th>Estado</th><th></th></tr></thead><tbody>'
    + ls.map(r => { const k = calcular(r); return '<tr style="cursor:pointer" data-id="' + r.id + '"><td>' + fmt(r.creado) + '</td><td><b>' + esc(r.cliente || '—') + '</b>' + ((r.adjuntos || []).length ? ' 🖼' : '') + '<span class="sub">' + esc(r.paquete || r.destino || '') + (r.proveedor ? ' · ' + esc(r.proveedor) : '') + '</span></td>'
      + '<td>' + fmt(r.salida) + (r.regreso ? '<span class="sub">al ' + fmt(r.regreso) + '</span>' : '') + (r.pasajeros ? '<span class="sub">' + r.pasajeros + ' pax</span>' : '') + '</td>'
      + '<td class="r">' + money(k.neto, r.moneda) + '</td><td class="r">' + money(k.venta, r.moneda) + '</td><td class="r">' + money(k.com, r.moneda) + '<span class="sub">' + k.pct + ' %</span></td>'
      + '<td class="r"><b class="' + (k.gan < 0 ? 'neg' : 'pos') + '">' + money(k.gan, r.moneda) + '</b></td><td><select class="estsel ' + esc(r.estado) + '" data-est="' + r.id + '">' + ESTADOS.map(s => '<option' + (s === r.estado ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></td><td><button type="button" class="btn ghost tiny" data-ed="' + r.id + '">✎ Editar</button></td></tr>'; }).join('')
    + '</tbody></table></div>' : '<p class="empty">No hay cotizaciones' + (q || est || mes ? ' con ese filtro' : '') + '.</p>';
  $('lista').querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = e => { if (e.target.closest('select')) return; abrir(filas.find(r => r.id === tr.dataset.id)); });
  $('lista').querySelectorAll('[data-est]').forEach(sel => sel.onchange = async () => { const r = filas.find(x => x.id === sel.dataset.est); const antes = r.estado; r.estado = sel.value; sel.className = 'estsel ' + sel.value;
    try { await rest('codigo_cotizaciones?id=eq.' + r.id, { method: 'PATCH', body: JSON.stringify({ estado: r.estado, actualizado: new Date().toISOString() }) }); pintar(); } catch (e) { r.estado = antes; alert('No se pudo cambiar el estado: ' + e.message); pintar(); } });
  if (vista === 'rent') rentabilidad();
}
function rentabilidad() {
  const el = $('vRent'), conf = filas.filter(r => r.estado === 'Confirmada'), pot = filas.filter(r => r.estado === 'Pendiente' || r.estado === 'Enviada');
  const agrupar = (ls, key) => { const m = {}; for (const r of ls) { const k = key(r) + '|' + (r.moneda || 'USD'), x = calcular(r); m[k] = m[k] || { k: key(r), c: r.moneda || 'USD', n: 0, pax: 0, v: 0, ne: 0, co: 0, g: 0 };
    const o = m[k]; o.n++; o.pax += Number(r.pasajeros || 0); o.v += x.venta; o.ne += x.neto; o.co += x.com; o.g += x.gan; } return Object.values(m); };
  const tabla = (tit, rows, col) => '<div class="panel" style="margin-bottom:14px"><h3 style="margin:0 0 10px">' + tit + '</h3>' + (rows.length ? '<div class="tw"><table><thead><tr><th>' + col + '</th><th class="r">Cotiz.</th><th class="r">Pax</th><th class="r">Venta</th><th class="r">Neto</th><th class="r">Comisión Martín</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>'
    + rows.map(o => '<tr><td><b>' + esc(o.k) + '</b></td><td class="r">' + o.n + '</td><td class="r">' + (o.pax || '—') + '</td><td class="r">' + money(o.v, o.c) + '</td><td class="r">' + money(o.ne, o.c) + '</td><td class="r">' + money(o.co, o.c) + '</td><td class="r"><b class="' + (o.g < 0 ? 'neg' : 'pos') + '">' + money(o.g, o.c) + '</b></td><td class="r">' + pc(o.g, o.v) + '</td></tr>').join('')
    + '</tbody></table></div>' : '<p class="empty">Sin datos.</p>') + '</div>';
  const mesN = r => { const d = String(r.salida || r.creado).slice(0, 7); const [y, m] = d.split('-'); return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m - 1] + ' ' + y; };
  const tot = agrupar(conf, () => 'Total confirmadas'), totP = agrupar(pot, () => 'En curso (pendientes y enviadas)');
  const efect = filas.length ? Math.round(conf.length / filas.filter(r => r.estado !== 'Pendiente').length * 100) || 0 : 0;
  el.innerHTML = '<div class="cards">' + tot.map(o => '<div class="kpi"><span>Ganancia confirmada ' + o.c + '</span><b class="pos">' + money(o.g, o.c) + '</b><span>' + o.n + ' cotiz. · margen ' + pc(o.g, o.v) + '</span></div><div class="kpi"><span>Comisión de Martín ' + o.c + '</span><b>' + money(o.co, o.c) + '</b></div>').join('')
    + totP.map(o => '<div class="kpi"><span>Ganancia posible ' + o.c + ' (' + o.n + ' en curso)</span><b>' + money(o.g, o.c) + '</b></div>').join('')
    + '<div class="kpi"><span>Efectividad (confirmadas / enviadas+confirmadas+perdidas)</span><b>' + (filas.some(r => r.estado !== 'Pendiente') ? efect + ' %' : '—') + '</b></div></div>'
    + '<p class="sub" style="margin:-4px 0 12px">La rentabilidad real se calcula con las cotizaciones <b>Confirmadas</b>. Por mes de salida del viaje.</p>'
    + tabla('Por mes', agrupar(conf.slice().sort((a, b) => String(a.salida || a.creado).localeCompare(String(b.salida || b.creado))), mesN), 'Mes')
    + tabla('Por destino', agrupar(conf, r => r.destino || r.paquete || 'Sin destino').sort((a, b) => b.g - a.g), 'Destino')
    + tabla('Por proveedor', agrupar(conf, r => r.proveedor || 'Sin proveedor').sort((a, b) => b.g - a.g), 'Proveedor');
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { vista = t.dataset.v; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); $('vCot').style.display = vista === 'cot' ? '' : 'none'; $('vRent').style.display = vista === 'rent' ? '' : 'none'; if (vista === 'rent') rentabilidad(); });
$('q').oninput = pintar; $('fEst').onchange = pintar; $('fMes').onchange = pintar;

/* flyer: se lee el texto de la imagen (gratis, en la computadora) */
function leerFlyer(texto) {
  const MES = { enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6, julio:7, agosto:8, septiembre:9, setiembre:9, octubre:10, noviembre:11, diciembre:12 };
  let t = String(texto || '').replace(/\r/g, '');
  t = t.replace(/(\d)\s*de\s*(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\s*de\s*(\d{4})/gi, '$1 de $2 de $3');
  t = t.replace(/\b([A-Z]{3})O(\d)/g, '$1 0$2').replace(/\b([A-Z]{3})(\d{1,2}[:.]\d{2})/g, '$1 $2');
  const lines = t.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const r = { destino: '', fechas: [], noches: '', regimen: '', moneda: '', opciones: [], vuelos: [], incluye: [] };
  // fechas
  let m; const reF = /(\d{1,2}) de ([a-záéíóú]+) de (\d{4})|(\d{1,2})\/(\d{1,2})\/(\d{4})/gi;
  while ((m = reF.exec(t))) { const d = m[1] ? [m[3], MES[m[2].toLowerCase()], m[1]] : [m[6], +m[5], m[4]]; if (d[1]) r.fechas.push(d[0] + '-' + String(d[1]).padStart(2, '0') + '-' + String(d[2]).padStart(2, '0')); }
  r.fechas = [...new Set(r.fechas)];
  m = t.match(/(\d{1,2})\s*noches/i); if (m) r.noches = m[1];
  m = t.match(/all inclusive|todo incluido|media pensi[oó]n|pensi[oó]n completa|desayuno|\bMAP\b|full board/i); if (m) r.regimen = /^map$/i.test(m[0]) ? 'MAP (media pensión)' : m[0].replace(/^./, c => c.toUpperCase());
  r.moneda = /USD|U\$S|d[oó]lares/i.test(t) ? 'USD' : /EUR|€\s*\d/.test(t) ? 'EUR' : 'ARS';
  for (const [re, txt] of [[/carry|equipaje|valija/i, 'equipaje'], [/traslado|TRF|IN ?\/ ?OUT/i, 'traslados'], [/asistencia/i, 'asistencia al viajero'], [/a[eé]reo|vuelo/i, 'aéreos']]) if (re.test(t)) r.incluye.push(txt);
  // vuelos
  for (const l of lines) { const v = l.match(/\b([A-Z]{3}) (\d{1,2})[:.](\d{2}) ?[>›→\-]+ ?([A-Z]{3}) (\d{1,2})[:.](\d{2})/); if (v) { const n = l.slice(v.index + v[0].length).match(/\b([A-Z][A-Z0-9]) ?(\d{3,4})\b/); const f = l.match(/(\d{1,2}) de ([a-záéíóú]+) de (\d{4})/i);
      r.vuelos.push((f ? f[1] + ' ' + f[2].slice(0, 3) + ' · ' : '') + v[1] + ' ' + v[2].padStart(2, '0') + ':' + v[3] + ' → ' + v[4] + ' ' + v[5].padStart(2, '0') + ':' + v[6] + (n ? ' · ' + n[1] + ' ' + n[2] : '')); } }
  // destino: primer título (Bahía 2027) + país en mayúsculas
  const NO = /^(alma|viajera|turismo|vuelos?|ida|vuelta|regreso|opciones|impuestos|infantes|tarifa|precio|por persona|incluye|con carry|traslados)/i;
  for (const l of lines.slice(0, 12)) { const x = l.replace(/[^\p{L}\d ,]/gu, '').trim(); if (!r.destino && /^\p{Lu}\p{Ll}+( \p{L}+){0,3}( 20\d\d)?$/u.test(x) && !NO.test(x)) r.destino = x.replace(/ 20\d\d$/, ''); }
  const pais = lines.slice(0, 12).map(l => l.replace(/[^\p{L} ]/gu, '').trim()).find(l => /^(BRASIL|ARGENTINA|M[EÉ]XICO|CARIBE|URUGUAY|CHILE|PER[UÚ]|ESPA[ÑN]A|ITALIA|FRANCIA|EUROPA|CUBA|REP[UÚ]BLICA DOMINICANA|ESTADOS UNIDOS|COLOMBIA|PANAM[AÁ])$/.test(l));
  if (pais) r.destino = (r.destino ? r.destino + ', ' : '') + pais.charAt(0) + pais.slice(1).toLowerCase();
  // hoteles: renglones en mayúsculas (se unen los consecutivos) y el precio que sigue
  const esHotel = l => { const x = l.replace(/[^\p{L} ]/gu, '').trim(); if (x.length < 6 || /\d/.test(l.replace(/\|.*$/, ''))) return ''; const may = (x.match(/\p{Lu}/gu) || []).length, min = (x.match(/\p{Ll}/gu) || []).length;
    return may >= 5 && may > min * 3 && !/^(ALMA|VIAJERA|VUELOS|BRASIL|IDA|VUELTA|USD|TARIFA|IMPUESTOS|LATAM|LIGHT)\b/.test(x) && !/^(BRASIL|ARGENTINA|MEXICO|CARIBE)$/.test(x) ? x.replace(/\b(USD|ARS|EUR)\b/g, '').replace(/\b[A-Z]\b/g, '').replace(/\s+/g, ' ').trim() : ''; };
  const precioEn = l => { const s = l.replace(/[|€$]/g, ' ').replace(/\b(USD|U\$S|ARS|EUR)\b/g, ' '); let ms = [...s.matchAll(/(?:^|\s)(\d{1,3}(?:[ .]\d{3})+|\d{3,6})(?:,(\d{2}))?(?=\s|$)/g)].map(x => Number(x[1].replace(/[ .]/g, '') + (x[2] ? '.' + x[2] : ''))).filter(n => n >= 100 && n <= 200000 && !(n >= 2024 && n <= 2035));
    if (!ms.length) { const j = s.match(/(?:^|\s)(\d{1,4}(?: \d{1,4}){1,2})\s*$/); if (j) { const n = Number(j[1].replace(/ /g, '')); if (n >= 100 && n <= 200000) ms = [n]; } }
    return ms.length ? ms[ms.length - 1] : null; };
  let cur = null;
  for (let i = 0; i < lines.length; i++) { const l = lines[i], h = esHotel(l);
    if (h) { if (cur && !cur.precio && esHotel(lines[i - 1] || '') === cur._last) { cur.hotel += ' ' + h; cur._last = h; continue; } cur = { hotel: h, _last: h, precio: null, regimen: '', noches: '' }; r.opciones.push(cur); continue; }
    if (!cur) continue;
    if (/infantes|impuestos|tasas|@|\+54|piso/i.test(l)) continue;
    const rg = l.match(/all inclusive|todo incluido|media pensi[oó]n|pensi[oó]n completa|desayuno|\bMAP\b/i); if (rg && !cur.regimen) cur.regimen = /^map$/i.test(rg[0]) ? 'MAP (media pensión)' : rg[0].replace(/^./, c => c.toUpperCase());
    const nn = l.match(/(\d{1,2})\s*noches/i); if (nn && !cur.noches) cur.noches = nn[1];
    const p = precioEn(l.replace(/\d{1,2}\s*noches/i, '')); if (p && !cur.precio) cur.precio = p;
  }
  r.opciones = r.opciones.filter(o => o.precio).map(({ _last, ...o }) => o);
  // si no hubo hoteles con precio: un único precio «por persona» o «tarifa final»
  if (!r.opciones.length) { const cands = lines.filter(l => /por persona|tarifa|precio|total|USD|U\$S/i.test(l)).map(precioEn).filter(Boolean); if (cands.length) r.opciones.push({ hotel: '', precio: Math.max(...cands), regimen: r.regimen, noches: r.noches }); }
  return r;
}
let tess = null, flyerPend = [];
function cargarTess() { if (tess) return tess; tess = new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; sc.onload = () => ok(window.Tesseract); sc.onerror = () => { tess = null; ko(new Error('No se pudo cargar el lector (revisá la conexión).')); }; document.head.appendChild(sc); }); return tess; }
async function ocr(file, cb) { const T = await cargarTess(); const bmp = await createImageBitmap(file); const k = Math.max(1, Math.min(2.5, 2200 / bmp.width)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const x = c.getContext('2d'); x.filter = 'grayscale(1) contrast(1.3)'; x.drawImage(bmp, 0, 0, c.width, c.height); return (await T.recognize(c, 'spa', { logger: m => { if (m.status === 'recognizing text') cb(Math.round(m.progress * 100)); } })).data.text; }
function ventaDesdePP() { const pp = Number(F.precio_pp.value), px = Number(F.pasajeros.value); if (pp && px) F.venta.value = Math.round(pp * px * 100) / 100; }
function aplicarFlyer(r, o) {
  const set = (n, v) => { if (v != null && v !== '') F.elements[n].value = v; };
  set('destino', r.destino); set('salida', r.fechas[0]); set('regreso', r.fechas[1]); set('moneda', r.moneda);
  if (o) { set('paquete', [o.hotel, o.regimen || r.regimen, (o.noches || r.noches) ? (o.noches || r.noches) + ' noches' : '', r.vuelos.length ? 'con aéreo' : ''].filter(Boolean).join(' · ')); set('precio_pp', o.precio); }
  const nota = [r.vuelos.length ? 'Vuelos: ' + r.vuelos.join(' | ') : '', r.incluye.length ? 'Incluye: ' + r.incluye.join(', ') : ''].filter(Boolean).join('\n');
  if (nota && !F.notas.value.includes(nota)) F.notas.value = (F.notas.value ? F.notas.value + '\n' : '') + nota;
  ventaDesdePP(); recalc(); $('flOpc').innerHTML = '<p class="sub" style="margin:6px 0 0">✓ Datos tomados del flyer. Revisalos, completá cliente y pasajeros, y cargá el <b>neto</b> a mano.</p>';
}
function pintarFlyers() { const ya = (actual?.adjuntos || []); $('flVer').innerHTML = ya.map((a, i) => ' <a href="#" data-fv="' + i + '">🖼 ' + esc(a.nombre) + '</a>').join('') + flyerPend.map(f => ' <span class="sub" style="display:inline">🖼 ' + esc(f.name) + ' (se guarda al tocar Guardar)</span>').join('');
  $('flVer').querySelectorAll('[data-fv]').forEach(x => x.onclick = async e => { e.preventDefault(); const a = ya[+x.dataset.fv], w = window.open('', '_blank');
    try { const r = await fetch(URL_ + '/storage/v1/object/authenticated/codigo/' + a.ruta, { headers: { apikey: KEY, Authorization: 'Bearer ' + await token() } }); if (!r.ok) throw new Error('No se pudo abrir el flyer'); const u = URL.createObjectURL(await r.blob()); if (w) w.location.href = u; else location.href = u; } catch (er) { if (w) w.close(); alert(er.message); } }); }
async function subirFlyers(id) { const out = []; for (const f of flyerPend) { const ruta = id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]+/g, '_');
    const r = await fetch(URL_ + '/storage/v1/object/codigo/' + ruta, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': f.type || 'image/jpeg', 'x-upsert': 'true' }, body: f });
    if (r.ok) out.push({ nombre: f.name, ruta }); } flyerPend = []; return out; }
$('fFlyer').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return; flyerPend.push(...files); pintarFlyers();
  const est = $('flEstado'); let txt = '';
  try { for (let i = 0; i < files.length; i++) { est.textContent = 'Leyendo el flyer…'; txt += '\n' + await ocr(files[i], p => est.textContent = 'Leyendo el flyer… ' + p + ' %'); } }
  catch (er) { est.textContent = ''; return alert(er.message || 'No se pudo leer el flyer'); }
  est.textContent = ''; const r = leerFlyer(txt);
  if (!r.opciones.length && !r.fechas.length && !r.destino) { $('flOpc').innerHTML = '<p class="sub" style="color:var(--bad)">No pude leer datos del flyer. Completalos a mano (el flyer queda guardado igual).</p>'; return; }
  if (r.opciones.length > 1) { $('flOpc').innerHTML = '<p class="sub" style="margin:6px 0 2px">El flyer tiene ' + r.opciones.length + ' opciones. Elegí la que se cotiza:</p>' + r.opciones.map((o, i) => '<div class="opc" data-o="' + i + '"><b>' + esc(o.hotel || 'Opción ' + (i + 1)) + '</b><span class="sub" style="display:inline">' + esc([o.regimen, o.noches ? o.noches + ' noches' : ''].filter(Boolean).join(' · ')) + '</span><span style="margin-left:auto"><b>' + money(o.precio, r.moneda) + '</b> p/p</span></div>').join('');
    $('flOpc').querySelectorAll('[data-o]').forEach(d => d.onclick = () => aplicarFlyer(r, r.opciones[+d.dataset.o])); }
  else aplicarFlyer(r, r.opciones[0]);
};

/* formulario */
const F = $('fCot');
F.estado.innerHTML = ESTADOS.map(s => '<option>' + s + '</option>').join('');
function recalc() { const x = Object.fromEntries(new FormData(F)), k = calcular(x), c = x.moneda;
  $('calc').innerHTML = '<div><span>Precio de venta</span><b>' + money(k.venta, c) + '</b></div><div><span>− Neto del paquete</span><span>' + money(k.neto, c) + '</span></div>'
    + '<div><span>− Comisión de Martín (' + k.pct + ' % sobre ' + ({ venta: 'la venta', neto: 'el neto', margen: 'la diferencia' }[x.comision_base]) + ')</span><span>' + money(k.com, c) + '</span></div>'
    + '<div class="tot"><span>Ganancia del paquete</span><span class="' + (k.gan < 0 ? 'neg' : 'pos') + '">' + money(k.gan, c) + (k.venta ? ' · ' + pc(k.gan, k.venta) : '') + '</span></div>'; }
F.addEventListener('input', recalc);
F.precio_pp.addEventListener('input', ventaDesdePP); F.pasajeros.addEventListener('input', ventaDesdePP);
function abrir(r) {
  actual = r || null; F.reset();
  const v = r ? { ...r, precio_pp: r.extra?.precio_pp ?? '' } : { moneda: 'USD', estado: 'Pendiente', comision_base: 'venta', comision_pct: pctDef() };
  flyerPend = []; $('flOpc').innerHTML = ''; $('flEstado').textContent = '';
  for (const el of F.elements) if (el.name && v[el.name] != null) el.value = v[el.name];
  $('dTit').textContent = r ? 'Cotización · ' + (r.cliente || '') : 'Nueva cotización';
  $('bBorrar').style.display = r ? '' : 'none'; recalc(); pintarFlyers(); $('dlg').showModal();
}
$('bNueva').onclick = () => abrir(null);
document.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = () => $('dlg').close());
$('bBorrar').onclick = async () => { if (!actual || !confirm('¿Eliminar esta cotización?')) return; try { for (const a of actual.adjuntos || []) { try { await fetch(URL_ + '/storage/v1/object/codigo/' + a.ruta, { method: 'DELETE', headers: { apikey: KEY, Authorization: 'Bearer ' + await token() } }); } catch (e) {} }
    await rest('codigo_cotizaciones?id=eq.' + actual.id, { method: 'DELETE' }); $('dlg').close(); await cargar(); } catch (e) { alert(e.message); } };
F.onsubmit = async e => {
  e.preventDefault(); const x = Object.fromEntries(new FormData(F)), n = v => v === '' ? null : Number(v), d = v => v || null;
  const body = { cliente: x.cliente.trim(), contacto: x.contacto.trim(), paquete: x.paquete.trim(), destino: x.destino.trim(), proveedor: x.proveedor.trim(), salida: d(x.salida), regreso: d(x.regreso),
    pasajeros: n(x.pasajeros), moneda: x.moneda, neto: n(x.neto), venta: n(x.venta), comision_pct: n(x.comision_pct), comision_base: x.comision_base, estado: x.estado, notas: x.notas.trim(), actualizado: new Date().toISOString(), extra: { ...(actual?.extra || {}), precio_pp: n(x.precio_pp) } };
  try { let id = actual?.id;
    if (actual) await rest('codigo_cotizaciones?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(body) });
    else id = (await (await rest('codigo_cotizaciones', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(body) })).json())[0]?.id;
    if (flyerPend.length && id) { const nuevos = await subirFlyers(id); if (nuevos.length) await rest('codigo_cotizaciones?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ adjuntos: [...(actual?.adjuntos || []), ...nuevos] }) }); }
    $('dlg').close(); await cargar(); } catch (er) { alert('No se pudo guardar: ' + er.message); }
};

/* si ya había una sesión abierta en esta pestaña */
try { const s = JSON.parse(sessionStorage.getItem(SK) || 'null'); if (s) { ses = s; token().then(entrar).catch(() => {}); } } catch (e) {}
})();
